packages:
  - "apps/messaging-api"
  - "apps/messaging-admin-next"
  - "apps/public-servant-portal"
  - "apps/messaging-support"
  - "apps/messaging-next"
  - "apps/citizen-portal"
  - "apps/upload-api"
  - "apps/scheduler-api"
  - "apps/profile-api"
  - "packages/citizen-shared"
