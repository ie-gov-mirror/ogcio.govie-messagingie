  /v2/pages/:
    get:
      operationId: pages_list
      description: |
        Published pages, filtered and paged. Pass `type` to request a page type's own fields, e.g. `?type=life_events.LifeEventPage&fields=highlighted,category`.

        StreamField content (`body`, `services`, `guidance`, `categories`) is a list of
        `{"type", "value", "id"}` blocks in Wagtail's shape, with links resolved:

        - `heading`: plain string; `sub_heading`: `{"text"}`
        - `paragraph` and other rich text: one HTML string. Links are absolute;
          internal links also carry `data-page-id` and `data-api-url`, documents
          `data-document-id`
        - `button_link` and other links: a list holding one link block.
          `internal_link` values are `{"page", "link_text", "url", "api_url"}`,
          `external_link` values `{"link_url", "link_text"}`
        - `image`: `{"image": {"id", "title", "url", "width", "height", "original_url"},
          "alt", "alt_text", "image_is_decorative", "caption", "caption_alignment"}`;
          `url` is a 960px-wide rendition
        - page choosers (e.g. a category's `life_events`): `{"id", "title", "url", "api_url"}`

        Links to pages that aren't published are left out.
      summary: List pages
      parameters:
        - in: query
          name: child_of
          schema:
            type: integer
          description: Only children of this page ID, e.g. the landing page's ID.
        - in: query
          name: descendant_of
          schema:
            type: integer
          description: Only descendants of this page ID.
        - in: query
          name: fields
          schema:
            type: string
          description:
            "Comma-separated fields to include, or `*` for all. Life event
            pages: `highlighted`, `category`, `body`, `services`, `guidance`. Landing
            page: `body`, `categories`. Publication pages: `body`. Prefix with `-` to
            remove a default field."
        - in: query
          name: highlighted
          schema:
            type: boolean
          description:
            "Life event pages only (needs `type=life_events.LifeEventPage`):
            filter by the highlighted flag."
        - in: query
          name: limit
          schema:
            type: integer
          description: Page size (default 20).
        - in: query
          name: locale
          schema:
            type: string
            enum:
              - en
              - ga
          description: "Language code: `en` or `ga`."
        - in: query
          name: offset
          schema:
            type: integer
          description: Number of results to skip.
        - in: query
          name: order
          schema:
            type: string
          description: Field to order by, e.g. `title` or `-first_published_at`.
        - in: query
          name: search
          schema:
            type: string
          description: Full-text search.
        - in: query
          name: slug
          schema:
            type: string
          description: Exact page slug.
        - in: query
          name: type
          schema:
            type: string
          description:
            Page type as `app_label.ModelName`, e.g. `life_events.LifeEventPage`,
            `life_events.LifeEventsLandingPage` or `publication.PublicationPage`. Required
            to request or filter on that type's own fields.
          examples:
            LifeEvents:
              value: life_events.LifeEventPage
              summary: Life events
            LifeEventsLandingPage:
              value: life_events.LifeEventsLandingPage
              summary: Life events landing page
            Publications:
              value: publication.PublicationPage
      tags:
        - Pages (read-only)
      security:
        - oauth2:
            - read
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      total_count:
                        type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        meta:
                          type: object
                          properties:
                            type:
                              type: string
                              example: life_events.LifeEventPage
                            detail_url:
                              type: string
                              format: uri
                              description: This page's entry in the API.
                            html_url:
                              type: string
                              format: uri
                              description: The page on gov.ie.
                            slug:
                              type: string
                            first_published_at:
                              type: string
                              format: date-time
                            locale:
                              type: string
                              example: en
                        title:
                          type: string
                      additionalProperties:
                        description:
                          The fields requested with `fields`, depending
                          on the page type.
              examples:
                LifeEvents:
                  value:
                    meta:
                      total_count: 1
                    items:
                      - id: 203580
                        meta:
                          type: life_events.LifeEventPage
                          detail_url: https://api.example.gov.ie/v2/pages/203580/
                          html_url: https://www.gov.ie/en/life-events/child-starting-school/
                          slug: child-starting-school
                          first_published_at: "2026-10-02T11:18:16+01:00"
                          locale: en
                        title: Child starting school
                        highlighted: true
                        category: Education & Learning
                        body:
                          - type: heading
                            value: Getting ready to apply
                            id: 768a998c-d66f-4c5a-b5b8-421aa0a92587
                          - type: paragraph
                            value:
                              <p>Most families start this in the year before their
                              child starts school. Read the <a data-api-url="https://api.example.gov.ie/v2/pages/203578/"
                              data-page-id="203578" href="https://www.gov.ie/en/life-events/">life
                              events overview</a>.</p><ul><li>your PPSN</li><li>your child's
                              birth certificate</li></ul>
                            id: b2a5a4be-9fcd-4fad-a3e3-500022d07b5d
                          - type: button_link
                            value:
                              - type: internal_link
                                value:
                                  page: 190505
                                  link_text: Start application
                                  url: https://www.gov.ie/en/school-places/
                                  api_url: https://api.example.gov.ie/v2/pages/190505/
                                id: ccbd2d7f-db51-4bfd-9b6e-5c8badd8070c
                            id: fff3b920-1324-4662-aa61-26dd02f99e39
                        services:
                          - type: service
                            value:
                              link:
                                - type: external_link
                                  value:
                                    link_url: https://www.gov.ie/
                                    link_text: Apply for a school place
                                  id: 41901d70-b72f-4ba7-9dc2-093a1967ea09
                              description:
                                Apply for a primary school place. Takes 20
                                to 25 minutes.
                            id: a2682c21-23f3-4540-a0a2-359e329f672b
                        guidance:
                          - type: external_link
                            value:
                              link_url: https://www.gov.ie/
                              link_text: Choosing a primary school
                            id: 8747ac50-b497-435e-b02f-e3dcc45a43d1
                  summary: Life events
          description: ""
        "400":
          description: Unknown field or filter, e.g. a type's field without `type`.
        "401":
          description: Missing or expired access token.
  /v2/pages/{id}/:
    get:
      operationId: pages_retrieve
      description: |
        A published page with all its fields.

        StreamField content (`body`, `services`, `guidance`, `categories`) is a list of
        `{"type", "value", "id"}` blocks in Wagtail's shape, with links resolved:

        - `heading`: plain string; `sub_heading`: `{"text"}`
        - `paragraph` and other rich text: one HTML string. Links are absolute;
          internal links also carry `data-page-id` and `data-api-url`, documents
          `data-document-id`
        - `button_link` and other links: a list holding one link block.
          `internal_link` values are `{"page", "link_text", "url", "api_url"}`,
          `external_link` values `{"link_url", "link_text"}`
        - `image`: `{"image": {"id", "title", "url", "width", "height", "original_url"},
          "alt", "alt_text", "image_is_decorative", "caption", "caption_alignment"}`;
          `url` is a 960px-wide rendition
        - page choosers (e.g. a category's `life_events`): `{"id", "title", "url", "api_url"}`

        Links to pages that aren't published are left out.
      summary: Get one page
      parameters:
        - in: query
          name: fields
          schema:
            type: string
          description:
            "Comma-separated fields to include, or `*` for all. Life event
            pages: `highlighted`, `category`, `body`, `services`, `guidance`. Landing
            page: `body`, `categories`. Publication pages: `body`. Prefix with `-` to
            remove a default field."
        - in: path
          name: id
          schema:
            type: integer
          description: Page ID.
          required: true
      tags:
        - Pages (read-only)
      security:
        - oauth2:
            - read
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  meta:
                    type: object
                    properties:
                      type:
                        type: string
                        example: life_events.LifeEventPage
                      detail_url:
                        type: string
                        format: uri
                        description: This page's entry in the API.
                      html_url:
                        type: string
                        format: uri
                        description: The page on gov.ie.
                      slug:
                        type: string
                      first_published_at:
                        type: string
                        format: date-time
                      locale:
                        type: string
                        example: en
                  title:
                    type: string
                additionalProperties:
                  description:
                    The fields requested with `fields`, depending on the
                    page type.
              examples:
                LifeEvent:
                  value:
                    id: 203580
                    meta:
                      type: life_events.LifeEventPage
                      detail_url: https://api.example.gov.ie/v2/pages/203580/
                      html_url: https://www.gov.ie/en/life-events/child-starting-school/
                      slug: child-starting-school
                      first_published_at: "2026-10-02T11:18:16+01:00"
                      locale: en
                    title: Child starting school
                    highlighted: true
                    category: Education & Learning
                    body:
                      - type: heading
                        value: Getting ready to apply
                        id: 768a998c-d66f-4c5a-b5b8-421aa0a92587
                      - type: paragraph
                        value:
