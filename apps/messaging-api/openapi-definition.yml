    post:
      operationId: CreateMessage
      tags: *a1
      description: Creates a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preferredTransports
                - recipientUserId
                - security
                - scheduleAt
                - message
              properties:
                preferredTransports:
                  type: array
                  items:
                    type: string
                    enum:
                      - email
                      - lifeEvent
                    description: All the available provider types
                  description:
                    The list of the preferred transports to use. If the selected
                    transports are not available for the recipient, others will
                    be used
                recipientUserId:
                  type: string
                  description: Unique user id of the recipient
                security:
                  type: string
                  enum:
                    - confidential
                    - public
                  description: Confidentiality level of the message
                scheduleAt:
                  type: string
                  format: date-time
                  description: Date and time of when schedule the message
                message:
                  type: object
                  required:
                    - subject
                    - plainText
                    - language
                  properties:
                    threadName:
                      type: string
                      description: Thread Name used to group messages
                      minLength: 1
                    subject:
                      type: string
                      description:
                        Subject. This is the only part that will be seen outside of the
                        messaging platform is security is 'confidential'
                      minLength: 1
                    excerpt:
                      type: string
                      description: Brief description of the message
                    plainText:
                      type: string
                      description: Plain text version of the message
                      minLength: 1
                    richText:
                      type: string
                      description: Rich text (html) version of the message
                    language:
                      type: string
                      enum:
                        - en
                        - ga
                      description: Language used to send the message
                    externalId:
                      type: string
                      description: External id to link the message to an external system
                attachments:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 3
                  uniqueItems: true
                  description: Ids of the related attachments (maximum 3)
                bypassConsent:
                  type: boolean
                  default: false
                  description:
                    Set to true to bypass recipient messaging consent checks. Requires
                    platform:messaging:write; omitted or false preserves normal
                    consent enforcement.
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique Id of the resource
                  metadata:
                    type: object
                    properties:
                      links:
                        type: object
                        required:
                          - self
                          - first
                          - last
                          - pages
                        properties:
                          self:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the request itself
                          next:
                            type: object
                            properties:
                              href:
                                type: string
                                description:
                                  URL pointing to the next page of results in a paginated response.
                                  If there are no more results, this field may
                                  be omitted
                          prev:
                            type: object
                            properties:
                              href:
                                type: string
                                description:
                                  URL pointing to the previous page of results in a paginated
                                  response. If there are no more results, this
                                  field may be omitted
                          first:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the first page of results in a paginated response
                          last:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the first page of results in a paginated response
                          pages:
                            type: object
                            description:
                              It may contain a list of other useful URLs, e.g. one entry for
                              page:'page 1', 'page 2'
                            additionalProperties:
                              type: object
                              properties:
                                href:
                                  type: string
                        description: Object containing the links to the related endpoints
                      totalCount:
                        type: number
                        description: Number representing the total number of available items
