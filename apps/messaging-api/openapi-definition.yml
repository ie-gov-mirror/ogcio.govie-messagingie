openapi: 3.0.3
info:
  title: OGCIO MessagingIE API
  description: API for OGCIO MessagingIE Service
  version: 1.3.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /api/v1/messages/:
    get:
      operationId: ListMessages
      tags: &a1
        - Messages
      description:
        Returns all the messages for the requested organisation or the
        requested recipient
      parameters:
        - schema:
            type: string
            enum:
              - delivered
          in: query
          name: status
          required: false
        - schema:
            type: string
            enum:
              - "true"
              - "false"
              - "0"
              - "1"
          in: query
          name: isSeen
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: deletedAfterDateTime
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: tagId
          required: false
          description: Filter messages by tag id
        - schema:
            type: string
            enum:
              - "true"
              - "false"
              - "0"
              - "1"
          in: query
          name: untagged
          required: false
          description: If true, return only messages without a tag
        - schema:
            type: string
          in: query
          name: recipientUserId
          required: false
          description: Either recipientUserId and organisationId are mandatory
        - schema:
            type: string
          in: query
          name: organisationId
          required: false
          description: Either recipientUserId and organisationId are mandatory
        - schema:
            type: string
            pattern: ^[0-9][0-9]*|undefined$
            default: "0"
          in: query
          name: offset
          required: false
          description:
            Indicates where to start fetching data or how many records to skip,
            defining the initial position within the list
        - schema:
            type: string
            default: "20"
            pattern: ^([1-9]|100)|undefined$
          in: query
          name: limit
          required: false
          description:
            Indicates the maximum number (100) of items that will be returned
            in a single request
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - subject
                        - createdAt
                        - threadName
                        - organisationId
                        - recipientUserId
                        - attachmentsCount
                        - isSeen
                      properties:
                        id:
                          type: string
                          description: Unique Id of the message
                        subject:
                          type: string
                          description: Subject
                        createdAt:
                          type: string
                          description: Creation date time
                        threadName:
                          type: string
                          description: Thread Name used to group messages
                          nullable: true
                        organisationId:
                          type: string
                          description: Organisation sender id
                        recipientUserId:
                          type: string
                          description: Unique id of the recipient
                        attachmentsCount:
                          type: integer
                          description: Number of attachments
                        isSeen:
                          type: boolean
                          description: True if the message has already been seen by the recipient
                  metadata:
                    type: object
                    properties:
                      links:
                        type: object
                        required:
                          - self
                          - first
                          - last
                          - pages
                        properties:
                          self:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the request itself
                          next:
                            type: object
                            properties:
                              href:
                                type: string
                                description:
                                  URL pointing to the next page of results in a paginated response.
                                  If there are no more results, this field may
                                  be omitted
                          prev:
                            type: object
                            properties:
                              href:
                                type: string
                                description:
                                  URL pointing to the previous page of results in a paginated
                                  response. If there are no more results, this
                                  field may be omitted
                          first:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the first page of results in a paginated response
                          last:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the first page of results in a paginated response
                          pages:
                            type: object
                            description:
                              It may contain a list of other useful URLs, e.g. one entry for
                              page:'page 1', 'page 2'
                            additionalProperties:
                              type: object
                              properties:
                                href:
                                  type: string
                        description: Object containing the links to the related endpoints
                      totalCount:
                        type: number
                        description: Number representing the total number of available items
        4XX:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - detail
                  - requestId
                  - name
                  - statusCode
                properties:
                  code:
                    type: string
                    description: Code used to categorize the error
                  detail:
