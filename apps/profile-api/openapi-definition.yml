                    type: string
                    description:
                      If set, the endpoint searches for users whom contain this value in
                      the latest imported email
                  default: []
                ppsn:
                  type: array
                  items:
                    type: string
                    description:
                      If set, the endpoint searches for users whom contain this value in
                      the latest imported PPSN
                  default: []
                dateOfBirth:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                        description:
                          If set, the endpoint searches for users whose date of birth is from
                          this date (inclusive)
                      to:
                        type: string
                        format: date
                        description:
                          If set, the endpoint searches for users whose date of birth is to
                          this date (inclusive)
                  default: []
                id:
                  type: array
                  items:
                    type: string
                    description: If set, the endpoint searches for users that have this value as id
                  default: []
                logicalOperator:
                  anyOf:
                    - type: string
                      description:
                        If set to 'and', the endpoint returns users that match all the
                        provided search criteria. If not set or set to 'or', the
                        endpoint returns users that match at least one of the
                        provided search criteria
                      enum:
                        - and
                    - type: string
                      description:
                        If set to 'or', the endpoint returns users that match at least one
                        of the provided search criteria
                      enum:
                        - or
                  default: and
                offset:
                  type: string
                  pattern: ^[0-9][0-9]*|undefined$
                  default: "0"
                  description:
                    Indicates where to start fetching data or how many records to skip,
                    defining the initial position within the list
                limit:
                  type: string
                  default: "20"
                  pattern: ^([1-9]|100)|undefined$
                  description:
