  /api/v1/citizens/announcements/:
    get:
      operationId: citizenListAnnouncements
      tags:
        - CitizenAnnouncements
      description: List published announcements for the current citizen profile
      parameters:
        - schema:
            type: string
            enum:
              - profile
              - dashboard
              - messaging
          in: query
          name: applicationId
          required: true
        - schema:
            type: string
            enum:
              - "true"
              - "false"
              - "0"
              - "1"
          in: query
          name: newOnly
          required: false
        - schema:
            type: string
            pattern: ^[0-9][0-9]*|undefined$
            default: "0"
          in: query
          name: offset
          required: false
          description:
            Indicates where to start fetching data or how many records to skip,
            defining the initial position within the list
        - schema:
            type: string
            default: "20"
            pattern: ^([1-9]|100)|undefined$
          in: query
          name: limit
          required: false
          description:
            Indicates the maximum number (100) of items that will be returned
            in a single request
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - type: object
                          required:
                            - id
                            - applicationId
                            - isEnabled
                            - publishDate
                            - createdAt
                            - createdBy
                          properties:
                            id:
                              type: string
                              format: uuid
                            applicationId:
                              type: string
                              minLength: 1
                            isEnabled:
                              type: boolean
                            publishDate:
                              type: string
                              format: date-time
                            createdAt:
                              type: string
                              format: date-time
                            createdBy:
                              type: string
                              nullable: true
                        - type: object
                          required:
                            - translations
                          properties:
                            translations:
                              type: object
                              required:
                                - en
                                - ga
                              properties:
                                en:
                                  type: object
                                  required:
                                    - id
                                    - announcementId
                                    - language
                                    - title
                                    - description
                                    - createdAt
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    announcementId:
                                      type: string
                                      format: uuid
                                    language:
                                      type: string
                                      enum:
                                        - en
                                        - ga
                                    title:
                                      type: string
                                    description:
                                      type: string
                                    createdAt:
                                      type: string
                                      format: date-time
                                ga:
                                  type: object
                                  required:
                                    - id
                                    - announcementId
                                    - language
                                    - title
                                    - description
                                    - createdAt
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    announcementId:
                                      type: string
                                      format: uuid
                                    language:
                                      type: string
                                      enum:
                                        - en
                                        - ga
                                    title:
                                      type: string
                                    description:
                                      type: string
                                    createdAt:
                                      type: string
                                      format: date-time
                              additionalProperties: false
                  metadata:
                    type: object
                    properties:
                      links:
                        type: object
                        required:
                          - self
                          - first
                          - last
                          - pages
                        properties:
                          self:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the request itself
                          next:
                            type: object
                            properties:
                              href:
                                type: string
                                description:
                                  URL pointing to the next page of results in a paginated response.
                                  If there are no more results, this field may
                                  be omitted
                          prev:
                            type: object
                            properties:
                              href:
                                type: string
                                description:
                                  URL pointing to the previous page of results in a paginated
                                  response. If there are no more results, this
                                  field may be omitted
                          first:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the first page of results in a paginated response
                          last:
                            type: object
                            properties:
                              href:
                                type: string
                                description: URL pointing to the first page of results in a paginated response
                          pages:
                            type: object
                            description:
                              It may contain a list of other useful URLs, e.g. one entry for
                              page:'page 1', 'page 2'
                            additionalProperties:
                              type: object
                              properties:
                                href:
                                  type: string
                        description: Object containing the links to the related endpoints
                      totalCount:
                        type: number
                        description: Number representing the total number of available items
        4XX:
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - detail
                  - requestId
                  - name
                  - statusCode
                properties:
                  code:
                    type: string
