openapi: 3.0.3
info:
  title: Life Events Profile API
  description: API for Life Events Profile Service
  version: 0.1.3
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
